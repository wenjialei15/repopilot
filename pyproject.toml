[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "repopilot"
version = "0.1.0.dev0"
description = "Evidence-based repository health auditing and maintenance planning"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.28,<1", "pydantic>=2,<3", "pyyaml>=6,<7", "rich>=13,<16", "typer>=0.15,<1"]

[project.scripts]
repopilot = "repopilot.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "respx>=0.22,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6,<7"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
