name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --group dev --no-editable --python ${{ matrix.python-version }}
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy src scripts
      - run: uv run --no-sync pytest --cov=repopilot --cov-fail-under=90
      - run: uv run --no-sync repopilot --help
      - run: uv run --no-sync repopilot scan .
      - run: uv build
      - run: uv run --no-sync python scripts/verify_distribution.py
