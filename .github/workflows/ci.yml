name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --no-editable --python ${{ matrix.python-version }}
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy src
      - run: uv run --no-sync pytest --cov=repopilot
      - run: uv run --no-sync repopilot --help
      - run: uv run --no-sync repopilot scan .
      - run: uv build
